<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wortgarten — ألماني من الصفر</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#12302e;--mu:#6b8280;--pr:#0f9d8a;--pr2:#0b7a6b;--ac:#ffb020;--ok:#1fa65a;--bad:#e5484d;--bd:#dfe9e7;--vio:#7c5cd6}
.dark{--bg:#0e1a19;--card:#172a28;--tx:#e8f3f1;--mu:#8fa9a5;--bd:#26403d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Arabic",Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:16px 0 8px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero b{font-size:20px}.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer}.unit .ic{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.unit .m{flex:1}.unit small{color:var(--mu)}.stars{letter-spacing:2px;color:var(--ac)}
.lock{opacity:.5}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer}
.btn{background:var(--pr);color:#fff;width:100%}.btn:active{background:var(--pr2)}.btn2{background:var(--card);color:var(--tx);border:1px solid var(--bd);width:100%}
.opt{display:block;width:100%;text-align:center;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin:8px 0;font-size:18px}
.opt.ok{border-color:var(--ok);background:rgba(31,166,90,.15)}.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.15)}
.de{direction:ltr;unicode-bidi:isolate;font-weight:700}
.q{text-align:center;font-size:26px;margin:24px 0}.q .de{font-size:30px}
.flip{perspective:900px;height:200px;margin:14px 0}.flip>div{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.f>div{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;padding:10px;text-align:center}
.front{background:var(--card);border:2px solid var(--pr)}.back{background:var(--pr);color:#fff;transform:rotateY(180deg)}
.hint{font-size:14px;opacity:.8;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:5}
nav button{background:none;color:var(--mu);flex:1;font-size:12px;padding:6px}nav button span{display:block;font-size:22px}nav .on{color:var(--pr)}
.prog{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--pr)}
.words{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;margin:12px 0}.words button{background:var(--card);color:var(--tx);border:2px solid var(--bd);padding:10px 14px}
.slot{min-height:56px;border-bottom:2px dashed var(--bd);direction:ltr;display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;margin:10px 0}
.sp{background:none;font-size:24px;padding:4px 10px;color:var(--pr)}
.row{display:flex;gap:10px}.row>*{flex:1}
.good{color:var(--ok)}.badc{color:var(--bad)}.center{text-align:center}
.msg{padding:12px;border-radius:14px;margin:10px 0;font-weight:700}.msg.ok{background:rgba(31,166,90,.15);color:var(--ok)}.msg.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.big{font-size:56px;text-align:center}
.lvl{background:linear-gradient(135deg,var(--vio),#a78bfa);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}
.dlg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}.dlg .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:14px}
.dlg .bub{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;flex:1}
.dlg.me .av{background:var(--pr);color:#fff}.dlg.ot .av{background:var(--vio);color:#fff}
.bub .de{display:block;font-size:17px}.bub small{color:var(--mu)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr;margin:12px 0}
.mgrid button{padding:16px 8px;font-size:16px;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.mgrid button.sel{border-color:var(--vio);background:rgba(124,92,214,.12)}
.mgrid button.hit{border-color:var(--ok);background:rgba(31,166,90,.15);opacity:.55;pointer-events:none}
.mgrid button.miss{border-color:var(--bad);background:rgba(229,72,77,.15)}
table.conj{width:100%;border-collapse:collapse;direction:ltr}table.conj td,table.conj th{border:1px solid var(--bd);padding:8px;text-align:center}
table.conj th{background:var(--bg)}
input.srch{width:100%;font:inherit;padding:13px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.tag{display:inline-block;background:rgba(15,157,138,.12);color:var(--pr);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-inline-start:6px}
canvas.chart{width:100%;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.toolcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.toolcard .ic{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.certwrap canvas{width:100%;border-radius:14px;border:1px solid var(--bd)}
.credit{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}
.rmark{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--ac);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:900;font-size:28px;line-height:1;transform:rotate(-8deg);box-shadow:0 3px 8px rgba(11,122,107,.35);text-shadow:0 1px 2px rgba(0,0,0,.3);flex-shrink:0}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<script src="data.js"></script>
<script src="data2.js"></script>
<script>
const $=s=>document.querySelector(s);
const DEF={xp:0,streak:0,last:'',done:{},srs:{},today:{d:'',xp:0},dark:false,goal:30,hist:{},wrong:{},name:'',placed:false};
const L=Object.assign({},DEF,JSON.parse(localStorage.getItem('de_state')||'{}'));
const save=()=>localStorage.setItem('de_state',JSON.stringify(L));
const day=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const ONE=864e5;
if(L.dark)document.body.classList.add('dark');
const UNITS_ALL=UNITS.concat(UNITS2);
function speak(t){t=t.replace(/\.\.\./g,'');try{if(window.Android)Android.speak(t);else{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
function addXP(n){const d=day();if(L.today.d!==d)L.today={d,xp:0};L.today.xp+=n;L.xp+=n;L.hist[d]=(L.hist[d]||0)+n;
 const ks=Object.keys(L.hist);if(ks.length>90)ks.sort().slice(0,ks.length-90).forEach(k=>delete L.hist[k]);
 if(L.last!==d){const y=new Date(Date.now()-ONE);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();L.streak=(L.last===yd)?L.streak+1:1;L.last=d}save()}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ALLW=UNITS_ALL.flatMap(u=>u.w.map(w=>({de:w[0],ar:w[1],u:u.id})));
const unlocked=u=>u===1||L.done[u-1]!==undefined;
let tab='home',stack=null;
function nav(){$('#nav').innerHTML=[['home','🏠','الرئيسية'],['rev','🔁','مراجعة'],['talk','💬','محادثات'],['tools','📚','أدوات'],['me','👤','أنا']].map(([k,i,t])=>`<button class="${tab===k&&!stack?'on':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('')}
function go(k){tab=k;stack=null;render()}
window.appBack=function(){if(stack){stack=null;render();return true}if(tab!=='home'){tab='home';render();return true}return false};
function render(){nav();window.scrollTo(0,0);
 if(stack)return stack();
 ({home,rev:reviewHome,talk:talkHome,tools:toolsHome,me})[tab]()}
function topbar(){const d=day();const t=L.today.d===d?L.today.xp:0;return `<div class="top"><span class="chip">🔥 ${L.streak} يوم</span><span class="chip">⭐ ${L.xp} نقطة</span><span class="chip">🎯 ${Math.min(t,L.goal)}/${L.goal}</span></div>`}
const escQ=s=>s.replace(/'/g,"\\'");
function sectionList(list){return list.map(u=>{const s=L.done[u.id];const ok=unlocked(u.id);
 return `<div class="card unit ${ok?'':'lock'}" onclick="${ok?`openUnit(${u.id})`:`alert('خلصي الوحدة اللي قبلها الأول 🔒')`}"><div class="ic">${u.icon}</div><div class="m"><b>${u.id}. ${u.t}</b><br><small>${u.w.length} كلمة · ${u.p.length} جمل</small></div><div class="stars">${s===undefined?(ok?'▶':'🔒'):'★'.repeat(s)+'☆'.repeat(3-s)}</div></div>`}).join('')}
function home(){const dn=Object.keys(L.done).length;
 $('#app').innerHTML=topbar()+`<div class="hero"><b>أهلاً${L.name?' يا '+L.name:''}! Hallo 👋</b><div>أكملتي ${dn} من ${UNITS_ALL.length} وحدة. كمّلي بنفس الحماس.</div><div class="bar"><i style="width:${dn/UNITS_ALL.length*100}%"></i></div></div>`+
 (L.placed?'':`<div class="card unit" onclick="placement()" style="border:2px solid var(--vio)"><div class="ic">🎯</div><div class="m"><b>اختبار تحديد المستوى</b><br><small>لو عندك أساس، خدي الاختبار وافتحي الوحدات على مستواك بدل ما تبدئي من الصفر</small></div><span style="font-size:22px">▶</span></div>`)+
 `<h2>المستوى الأول A1 — الأساس</h2>`+sectionList(UNITS)+`<h2>المستوى التاني A2 — التقدم</h2>`+sectionList(UNITS2)}
function openUnit(id){const u=UNITS_ALL.find(x=>x.id===id);let i=0;
 stack=()=>{const w=u.w[i];$('#app').innerHTML=`<div class="top"><button class="sp" onclick="appBack()">→</button><b>${u.icon} ${u.t}</b><span class="chip">${i+1}/${u.w.length}</span></div>
 <div class="prog"><i style="width:${(i+1)/u.w.length*100}%"></i></div>
 <div class="flip" id="fl" onclick="this.classList.toggle('f')"><div><div class="face front"><span class="de">${w[0]}</span><span class="hint">اضغطي لمعرفة المعنى</span></div><div class="face back">${w[1]}</div></div></div>
 <div class="center"><button class="sp" style="font-size:40px" onclick="speak('${escQ(w[0])}')">🔊</button></div>
 <div class="row"><button class="btn2" ${i?'':'disabled'} onclick="nx(-1)">السابق</button><button class="btn" onclick="nx(1)">${i<u.w.length-1?'التالي':'ابدأ التمرين'}</button></div>
 <div class="row" style="margin-top:10px"><button class="btn2" onclick="listenUnit(${u.id})">🎧 وضع الاستماع</button><button class="btn2" onclick="matchGame(${u.id})">🧩 لعبة التوصيل</button></div>
 <div class="card" style="margin-top:16px"><b>💡 نصيحة</b><p style="margin:6px 0 0">${u.g}</p></div>`;setTimeout(()=>speak(w[0]),200)};
 window.nx=d=>{if(i+d>=u.w.length){return quiz(u)}i=Math.max(0,i+d);render()};render()}
let LISTEN_STOP=false;
function listenUnit(id){const u=UNITS_ALL.find(x=>x.id===id);LISTEN_STOP=false;let i=0;const items=[...u.w.map(w=>[w[0],w[1],'كلمة']),...u.p.map(p=>[p[0],p[1],'جملة'])];
 stack=()=>{const it=items[i];$('#app').innerHTML=`<div class="top"><button class="sp" onclick="LISTEN_STOP=true;appBack()">→</button><b>🎧 ${u.t}</b><span class="chip">${i+1}/${items.length}</span></div>
 <div class="prog"><i style="width:${(i+1)/items.length*100}%"></i></div>
 <div class="card center" style="padding:36px 16px"><span class="tag">${it[2]}</span><div class="de" style="font-size:28px;margin:14px 0">${it[0]}</div><div style="color:var(--mu)">${it[1]}</div>
 <div style="margin-top:14px"><button class="sp" style="font-size:38px" onclick="speak('${escQ(it[0])}')">🔊</button></div></div>
 <button class="btn2" onclick="LISTEN_STOP=true;appBack()">إيقاف الاستماع</button>`;
 speak(it[0]);if(!LISTEN_STOP)setTimeout(()=>{if(!LISTEN_STOP&&stack){i=(i+1)%items.length;render()}},3200)};render()}
function matchGame(id){const u=UNITS_ALL.find(x=>x.id===id);const ws=shuffle(u.w).slice(0,6);const cards=shuffle(ws.flatMap((w,k)=>[{t:w[0],k,l:'de'},{t:w[1],k,l:'ar'}]));
 let first=null,moves=0,hits=0,lock=false;
 const draw=()=>{$('#mg').innerHTML=cards.map((c,j)=>c.done?`<button class="hit">${c.t}</button>`:`<button class="${first===j?'sel':''}" onclick="mtap(${j})">${c.t}</button>`).join('')};
 window.mtap=j=>{if(lock||cards[j].done||first===j)return;
  if(first===null){first=j;draw();return}
  const a=cards[first],b=cards[j];moves++;
  if(a.k===b.k){a.done=b.done=true;hits++;first=null;draw();
   if(hits===6){addXP(20);$('#mres').innerHTML=`<div class="msg ok">برافو! خلصتي في ${moves} محاولة وحصلتي على 20 نقطة 🎉</div><button class="btn" onclick="appBack()">تمام</button>`}}
  else{lock=true;draw();document.querySelectorAll('#mg button')[j].classList.add('miss');document.querySelectorAll('#mg button')[first].classList.add('miss');
   setTimeout(()=>{first=null;lock=false;draw()},700)}};
 stack=()=>{$('#app').innerHTML=`<div class="top"><button class="sp" onclick="appBack()">→</button><b>🧩 توصيل: ${u.t}</b><span class="chip" id="mmoves"></span></div>
 <p style="color:var(--mu)">وصّلي كل كلمة ألمانية بمعناها.</p><div class="mgrid" id="mg"></div><div id="mres"></div>`;draw()};render()}
function mkBlank(u){const out=[];(u.p||[]).forEach(p=>{const tokens=p[0].split(' ');const hit=u.w.find(w=>{const bare=w[0].replace(/^(der|die|das)\s+/,'');return tokens.some(t=>t.replace(/[.,!?]$/,'')===bare&&bare.length>3)});
 if(!hit)return;const bare=hit[0].replace(/^(der|die|das)\s+/,'');const idx=tokens.findIndex(t=>t.replace(/[.,!?]$/,'')===bare);
 const shown=tokens.map((t,k)=>k===idx?'_____':t).join(' ');const others=shuffle(u.w.filter(w=>w!==hit)).slice(0,3).map(w=>w[0].replace(/^(der|die|das)\s+/,''));
 out.push({type:'blank',sentence:shown,ar:p[1],ans:bare,opts:shuffle([bare,...others])})});return out}
function mkQ(u,wordsFor,phr){const qs=[];const ws=shuffle(wordsFor);
 ws.forEach((w,k)=>{const type=['de2ar','ar2de','listen'][k%3];const others=shuffle(ALLW.filter(x=>x.de!==w.de)).slice(0,3);
  const opts=shuffle([w,...others]);qs.push({type,w,opts})});
 if(u)qs.push(...mkBlank(u));
 shuffle(phr||[]).slice(0,3).forEach(p=>qs.push({type:'build',p}));
 return shuffle(qs).slice(0,14)}
function runQ(qs,title,onEnd){let i=0,ok=0,locked=false;
 const step=()=>{if(i>=qs.length)return onEnd(ok,qs.length);const q=qs[i];locked=false;
 let body='';
 if(q.type==='build'){const words=q.p[0].split(' ');q.sel=[];q.pool=shuffle(words.map((w,k)=>({w,k})));
  body=`<div class="q">ترجمي:<br><b>${q.p[1]}</b></div><div class="slot" id="sl"></div><div class="words" id="wd"></div><button class="btn" onclick="chk()">تأكيد</button><div id="fb"></div>`}
 else if(q.type==='blank'){body=`<div class="q">اختاري الكلمة الناقصة:<br><span class="de" style="font-size:24px">${q.sentence}</span><br><b>${q.ar}</b></div>`+q.opts.map((o,k)=>`<button class="opt de" onclick="pickB(${k})">${o}</button>`).join('')+`<div id="fb"></div>`}
 else{const t=q.type;const prompt=t==='de2ar'?`<div class="q">ما معنى<br><span class="de">${q.w.de}</span> <button class="sp" onclick="speak('${escQ(q.w.de)}')">🔊</button></div>`:t==='ar2de'?`<div class="q">إزاي تقولي<br><b>${q.w.ar}</b></div>`:`<div class="q">اسمعي واختاري المعنى<br><button class="sp" style="font-size:52px" onclick="speak('${escQ(q.w.de)}')">🔊</button></div>`;
  body=prompt+q.opts.map((o,k)=>`<button class="opt ${t==='ar2de'?'de':''}" onclick="pick(${k})">${t==='ar2de'?o.de:o.ar}</button>`).join('')+`<div id="fb"></div>`}
 $('#app').innerHTML=`<div class="top"><button class="sp" onclick="appBack()">✕</button><b>${title}</b><span class="chip">${i+1}/${qs.length}</span></div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>`+body;
 if(q.type==='build')drawB(q);
 if(q.type==='listen')setTimeout(()=>speak(q.w.de),250)};
 const fin=(good,msg,word)=>{locked=true;if(good)ok++;const q=qs[i];const w=word||q.w;if(w){srsMark(w,good);if(!good){L.wrong[w.de]=(L.wrong[w.de]||0)+1}else if(L.wrong[w.de]){L.wrong[w.de]=Math.max(0,L.wrong[w.de]-1)}save()}
  $('#fb').innerHTML=`<div class="msg ${good?'ok':'bad'}">${good?'صح! ✅':'غلط ❌'} ${msg||''}</div><button class="btn" onclick="nq()">${i<qs.length-1?'التالي':'النتيجة'}</button>`;if(good)speak(w?w.de:(q.p?q.p[0]:''))};
 window.nq=()=>{i++;step()};
 window.pick=k=>{if(locked)return;const q=qs[i];const o=q.opts[k];const good=o.de===q.w.de;
  document.querySelectorAll('.opt').forEach((b,j)=>{if(q.opts[j].de===q.w.de)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  fin(good,good?'':`الصح: ${q.w.de} = ${q.w.ar}`)};
 window.pickB=k=>{if(locked)return;const q=qs[i];const good=q.opts[k]===q.ans;
  document.querySelectorAll('.opt').forEach((b,j)=>{if(q.opts[j]===q.ans)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  fin(good,good?'':`الصح: ${q.ans}`)};
 window.drawB=q=>{$('#sl').innerHTML=q.sel.map(o=>`<button class="opt" style="width:auto;margin:0" onclick="unb(${o.k})">${o.w}</button>`).join('');
  $('#wd').innerHTML=q.pool.filter(o=>!q.sel.includes(o)).map(o=>`<button onclick="sel(${o.k})">${o.w}</button>`).join('')};
 window.sel=k=>{if(locked)return;const q=qs[i];q.sel.push(q.pool.find(o=>o.k===k));drawB(q)};
 window.unb=k=>{if(locked)return;const q=qs[i];q.sel=q.sel.filter(o=>o.k!==k);drawB(q)};
 window.chk=()=>{if(locked)return;const q=qs[i];const a=q.sel.map(o=>o.w).join(' ');fin(a===q.p[0],a===q.p[0]?'':'الصح: '+q.p[0])};
 step()}
function quiz(u){const qs=mkQ(u,u.w.map(w=>({de:w[0],ar:w[1]})),u.p);
 stack=()=>runQ(qs,u.t,(ok,n)=>{const r=ok/n;const s=r>=.9?3:r>=.7?2:r>=.4?1:0;
  const prev=L.done[u.id];if(s>0&&(prev===undefined||s>prev))L.done[u.id]=s;addXP(ok*5+(s>=1?20:0));save();
  stack=()=>{$('#app').innerHTML=`<div class="big">${s>=2?'🎉':s?'👍':'💪'}</div><h1 class="center">${ok} من ${n}</h1><div class="center stars" style="font-size:36px">${'★'.repeat(s)+'☆'.repeat(3-s)}</div><p class="center">${s?'حصلتي على '+(ok*5+20)+' نقطة':'محتاجة 40% عالأقل عشان تعدّي. جربي تاني!'}</p><button class="btn" onclick="appBack()">رجوع للمسار</button><div style="height:8px"></div><button class="btn2" onclick="quiz(UNITS_ALL.find(x=>x.id==${u.id}))">إعادة التمرين</button>`};render()});render()}
function srsMark(w,good){const k=w.de;const s=L.srs[k]||{box:0,due:0};
